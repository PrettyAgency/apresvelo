<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tour de Tasmania route map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #e6e1d4; }
  #map { width: 100%; height: 100%; background: #e6e1d4; }
  .leaflet-tile-pane { filter: grayscale(1) sepia(0.35) brightness(1.06) contrast(0.9); }
  .leaflet-container { font-family: 'Archivo', sans-serif; }
  .av-pin { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #cf0a2c; color: #f2efe8; font: 700 13px 'Archivo', sans-serif; border: 2px solid #f2efe8; box-shadow: 0 2px 6px rgba(24,28,30,0.35); }
  .av-pin.base { background: #1f3d33; }
  .av-wrap { position: relative; width: 0; height: 0; }
  .av-label { position: absolute; top: 0; left: 0; background: #f2efe8; color: #181c1e; font: 600 12px 'Archivo', sans-serif; padding: 4px 9px; border-radius: 4px; border: 1px solid #ddd8cc; white-space: nowrap; box-shadow: 0 1px 3px rgba(24,28,30,0.15); }
  .av-label.right { transform: translate(22px, -50%); }
  .av-label.left { transform: translate(calc(-100% - 22px), -50%); }
  .av-label.above { transform: translate(-50%, calc(-100% - 22px)); }
  .av-label.below { transform: translate(-50%, 22px); }
  .av-label small { display: block; font-weight: 400; color: #5c6670; font-size: 11px; margin-top: 1px; }
  .leaflet-control-attribution { font-size: 10px; background: rgba(242,239,232,0.85); color: #5c6670; }
  .leaflet-control-attribution a { color: #1f3d33; }
  .legend { position: absolute; top: 14px; left: 14px; z-index: 1000; background: #f2efe8; border: 1px solid #ddd8cc; border-radius: 6px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(24,28,30,0.12); }
  .legend h3 { margin: 0 0 4px; font: 600 16px 'Fraunces', serif; color: #181c1e; }
  .legend p { margin: 0; font: 400 12px 'Archivo', sans-serif; color: #5c6670; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend"><h3>Hobart, out and back</h3><p>One hotel, five loops. 378 km · 7,600 m</p></div>
<script>
  var hobart = [-42.8826, 147.3257];
  var stops = [
    { n: 1, ll: [-42.9050, 147.4260], name: 'Day 1 · Hobart roll-out', sub: 'Eastern shore & Bellerive', anchor: 'below' },
    { n: 2, ll: [-43.1547, 147.0738], name: 'Day 2 · Cygnet', sub: 'Huon coast road & gravel', anchor: 'below' },
    { n: 3, ll: [-42.9330, 147.2530], name: 'Day 3 · Pipeline Track', sub: 'Fern Tree gravel, MONA after', anchor: 'below' },
    { n: 4, ll: [-42.8961, 147.2372], name: 'Day 4 · kunanyi / Mt Wellington', sub: '17.7 km at 7% to the summit', anchor: 'left' },
    { n: 5, ll: [-42.7826, 147.0587], name: 'Day 5 · Derwent Valley', sub: 'White gravel into the vineyard', anchor: 'above' }
  ];

  var map = L.map('map', {
    zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false, attributionControl: true
  });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

  // schematic loops from Hobart to each day's focal point and back
  stops.forEach(function (s) {
    L.polyline([hobart, s.ll], { color: '#1f3d33', weight: 2.5, opacity: 0.85, dashArray: '6 6' }).addTo(map);
  });

  function pin(n, cls) {
    return L.divIcon({ className: '', html: '<div class="av-pin ' + (cls || '') + '">' + n + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
  }
  function label(s) {
    return L.divIcon({
      className: '',
      html: '<div class="av-wrap"><div class="av-label ' + s.anchor + '">' + s.name + '<small>' + s.sub + '</small></div></div>',
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
  }

  L.marker(hobart, { icon: pin('H', 'base'), interactive: false }).addTo(map);
  L.marker(hobart, { icon: label({ anchor: 'right', name: 'Hobart', sub: 'Base for the week · HBA airport' }), interactive: false }).addTo(map);

  stops.forEach(function (s) {
    L.marker(s.ll, { icon: pin(s.n), interactive: false }).addTo(map);
    L.marker(s.ll, { icon: label(s), interactive: false }).addTo(map);
  });

  var bounds = L.latLngBounds(stops.map(function (s) { return s.ll; }).concat([hobart]));
  map.fitBounds(bounds, { padding: [200, 60] });
  window.addEventListener('resize', function () { map.fitBounds(bounds, { padding: [200, 60] }); });
</script>
</body>
</html>
